<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ModResponse - HTTP Response Mocker</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon">
          <img class="brand-icon" src="icons/icon32.png" alt="ModHeader Logo">
        </div>
        <div class="title-group">
          <h1>ModResponse</h1>
          <span class="status-badge" id="status-indicator">
            <span class="dot"></span> <span id="status-text">已启用</span>
          </span>
        </div>
      </div>

      <div class="header-actions">
        <label class="switch-toggle" title="全局开关">
          <input type="checkbox" id="global-toggle" checked>
          <span class="slider"></span>
        </label>
        <button id="btn-open-options" class="icon-btn" title="打开全屏独立工作台">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs">
      <button class="tab-btn active" data-tab="rules-tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
        规则管理 (<span id="rule-count">0</span>)
      </button>
      <button class="tab-btn" data-tab="logs-tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
        </svg>
        拦截日志 (<span id="log-count">0</span>)
      </button>
      <button class="tab-btn" data-tab="tools-tab">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path
            d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z">
          </path>
        </svg>
        配置工具
      </button>
    </nav>

    <!-- Content Sections -->
    <main class="tab-content">

      <!-- TAB 1: RULES LIST -->
      <section id="rules-tab" class="tab-pane active">
        <div class="toolbar">
          <div class="search-box">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="rule-search" placeholder="搜索规则名称或 URL Pattern...">
          </div>
          <button id="btn-add-rule" class="btn btn-primary">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            新建规则
          </button>
        </div>

        <div id="rules-list" class="rules-list">
          <!-- 规则卡片动态渲染 -->
        </div>

        <div id="rules-empty" class="empty-state hidden">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="9" x2="15" y2="15"></line>
            <line x1="15" y1="9" x2="9" y2="15"></line>
          </svg>
          <p>暂无 Mock 规则</p>
          <button class="btn btn-secondary btn-sm" id="btn-create-first">立即新建一条规则</button>
        </div>
      </section>

      <!-- TAB 2: INTERCEPT LOGS -->
      <section id="logs-tab" class="tab-pane">
        <div class="toolbar">
          <span class="sub-title">最近实时拦截记录 (支持最多100条)</span>
          <button id="btn-clear-logs" class="btn btn-danger btn-sm">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            清空日志
          </button>
        </div>

        <div id="logs-container" class="logs-container">
          <!-- 动态日志渲染 -->
        </div>

        <div id="logs-empty" class="empty-state hidden">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <p>尚未拦截到符合条件的 HTTP 请求</p>
        </div>
      </section>

      <!-- TAB 3: TOOLS & IMPORT/EXPORT -->
      <section id="tools-tab" class="tab-pane">
        <div class="tools-card">
          <h3>规则备份与导出</h3>
          <p>将当前配置与所有 Mock 规则导出为 JSON 文件，或导入外部规则定义。</p>
          <div class="btn-group">
            <button id="btn-export-rules" class="btn btn-secondary">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              导出规则文件 (JSON)
            </button>
            <button id="btn-import-trigger" class="btn btn-secondary">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
              导入规则文件
            </button>
            <input type="file" id="import-file-input" accept=".json" class="hidden">
          </div>
        </div>

        <div class="tools-card">
          <h3>快速预设模板加载</h3>
          <p>一键添加常用的 Mock 响应模板。</p>
          <div class="preset-buttons">
            <button class="btn btn-sm btn-outline preset-btn" data-preset="json-success">+ 200 JSON 成功响应</button>
            <button class="btn btn-sm btn-outline preset-btn" data-preset="error-404">+ 404 Not Found 模板</button>
            <button class="btn btn-sm btn-outline preset-btn" data-preset="error-500">+ 500 Server Error 模板</button>
            <button class="btn btn-sm btn-outline preset-btn" data-preset="slow-delay">+ 2秒 延迟慢接口</button>
          </div>
        </div>
      </section>
    </main>

    <!-- RULE EDITOR MODAL -->
    <div id="rule-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modal-title">新建 Mock 规则</h2>
          <button id="modal-close" class="icon-btn">&times;</button>
        </div>
        <div class="modal-body">
          <form id="rule-form">
            <input type="hidden" id="edit-rule-id">

            <div class="form-row">
              <div class="form-group flex-2">
                <label for="rule-name">规则名称</label>
                <input type="text" id="rule-name" placeholder="例如: 用户信息 Mock" required>
              </div>
              <div class="form-group flex-1">
                <label for="rule-method">HTTP 方法</label>
                <select id="rule-method">
                  <option value="ALL">ALL (全部)</option>
                  <option value="GET">GET</option>
                  <option value="POST">POST</option>
                  <option value="PUT">PUT</option>
                  <option value="DELETE">DELETE</option>
                  <option value="PATCH">PATCH</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group flex-1">
                <label for="rule-match-type">匹配方式</label>
                <select id="rule-match-type">
                  <option value="contains">包含 (Contains)</option>
                  <option value="exact">精准匹配 (Exact)</option>
                  <option value="wildcard">通配符 (Wildcard *)</option>
                  <option value="regex">正则表达式 (Regex)</option>
                </select>
              </div>
              <div class="form-group flex-2">
                <label for="rule-pattern">URL 匹配表达式</label>
                <input type="text" id="rule-pattern" placeholder="例如: /api/v1/user 或 *user*" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group flex-1">
                <label for="rule-status">状态码 Status Code</label>
                <input type="number" id="rule-status" value="200" min="100" max="599" required>
              </div>
              <div class="form-group flex-1">
                <label for="rule-delay">响应延迟 (ms)</label>
                <input type="number" id="rule-delay" value="0" min="0" max="60000" step="50">
              </div>
              <div class="form-group flex-1">
                <label for="rule-type">数据类型</label>
                <select id="rule-type">
                  <option value="json">JSON</option>
                  <option value="text">Text / Plain</option>
                  <option value="html">HTML</option>
                  <option value="xml">XML</option>
                </select>
              </div>
            </div>

            <!-- Custom Headers -->
            <div class="form-group">
              <div class="label-with-action">
                <label>自定义 Response Headers</label>
                <button type="button" id="btn-add-header" class="text-link-btn">+ 添加 Header</button>
              </div>
              <div id="headers-container" class="headers-container">
                <!-- Header 键值对映射 -->
              </div>
            </div>

            <!-- Response Body -->
            <div class="form-group">
              <div class="label-with-action">
                <label for="rule-body">伪造响应内容 Response Body</label>
                <div class="body-actions">
                  <button type="button" id="btn-format-json" class="text-link-btn">格式化 JSON</button>
                  <button type="button" id="btn-minify-json" class="text-link-btn">压缩 JSON</button>
                </div>
              </div>
              <textarea id="rule-body" rows="8" placeholder='{\n  "code": 200,\n  "data": {}\n}'></textarea>
              <div id="json-error" class="error-msg hidden">JSON 语法错误，请检查格式！</div>
            </div>

            <div class="modal-footer">
              <button type="button" id="btn-cancel-rule" class="btn btn-secondary">取消</button>
              <button type="submit" id="btn-save-rule" class="btn btn-primary">保存规则</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
